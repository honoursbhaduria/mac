services:
  backend:
    build: ./backend
    environment:
      ELEXON_BASE_URL: ${ELEXON_BASE_URL:-https://data.elexon.co.uk/bmrs/api/v1}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-900}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-30}
      MAX_RETRIES: ${MAX_RETRIES:-3}
      MAX_DATE_RANGE_DAYS: ${MAX_DATE_RANGE_DAYS:-93}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      WINDY_MODEL: ${WINDY_MODEL:-openai/gpt-oss-120b}
      WINDY_FALLBACK_MODEL: ${WINDY_FALLBACK_MODEL:-openai/gpt-oss-20b}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    environment:
      API_UPSTREAM: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
